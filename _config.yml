title: Alexia Le Gall
description: Mechanical and mechatronics R&D engineer. CV, skills and selected projects.

# Project site at https://alexiaisgoofingaround.github.io/alexialegall/
# If you rename the repo to alexiaisgoofingaround.github.io (or use a custom domain), set baseurl: ""
url: "https://alexiaisgoofingaround.github.io"
baseurl: "/alexialegall"

# Used by the header, the home page, the CV page and the contact block of each project.
# Leave a line empty and its link disappears. Replace assets/files/cv.pdf with the real CV.
author:
  name: "Alexia Le Gall"
  role: "Mechanical & mechatronics engineer · R&D"
  tagline: "From specification to validated hardware."
  email: "alexia.le.gall@numericable.fr"
  linkedin: "https://www.linkedin.com/in/alexia-le-gall-831378164/"
  github: "https://github.com/alexiaisgoofingaround"
  photo: "assets/img/profile.png"
  photo_alt: "Portrait of Alexia Le Gall"
  cv_pdf: "assets/files/cv.pdf"

collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope: {path: "", type: "projects"}
    values: {layout: project}

exclude:
  - _drafts_projects/
  - README.md
  - Gemfile
  - Gemfile.lock
  - LICENSE
